name: 🚀 Auto Deploy to cPanel (Replay BOS)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual dari tab GitHub Actions

jobs:
  web-deploy:
    name: 📦 Build Assets & Sync to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Memungkinkan deteksi file yang berubah secara presisi

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ⚡ Install NPM & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET_DIR || './' }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT || 21 }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/vendor.zip
            **/vendor/**
            **/storage/logs/*.log
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/public/**
            **/tests/**
            **/.phpunit.result.cache
            **/phpunit.xml
            **/.editorconfig
            **/tsconfig.json
